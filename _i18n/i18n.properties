# -------------------------------------------------------------------------
# Server-side text bundle for CDS annotations.
# CAP resolves {i18n>Key} placeholders in .cds files against this file
# and emits the resolved text into the generated OData $metadata so that
# Fiori Elements displays human-readable labels for end users.
# See: https://cap.cloud.sap/docs/guides/uis/i18n
# -------------------------------------------------------------------------

# Entity / type labels
Incident            = Incident
Incidents           = Incidents
Conversation        = Conversation
Conversations       = Conversations

# Field labels (Incidents)
Title               = Title
Urgency             = Urgency
Customer            = Customer

# Field labels (Urgency code list)
Code                = Code
Name                = Name
Description         = Description

# Field labels (Conversations)
Timestamp           = Date & Time
Author              = Author
Message             = Message
Attachment          = Attachment
FileName            = File Name
MediaType           = Media Type

# Facet / group section headers
GeneralInformation  = General Information
ConversationDetails = Conversation Details
AttachmentDetails   = Attachment Details
